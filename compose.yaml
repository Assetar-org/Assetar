services:
  cms:
    build:
      context: ./cms
      args:
        PUBLIC_URL: ${CMS_PUBLIC_URL:?Set CMS_PUBLIC_URL}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PUBLIC_URL: ${CMS_PUBLIC_URL}
      TRUST_PROXY: "true"
      DATABASE_FILENAME: /app/data/data.db
      APP_KEYS: ${APP_KEYS:?Set APP_KEYS}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?Set ADMIN_JWT_SECRET}
      API_TOKEN_SALT: ${API_TOKEN_SALT:?Set API_TOKEN_SALT}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT:?Set TRANSFER_TOKEN_SALT}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      SEED_CONTENT: ${SEED_CONTENT:-true}
    volumes:
      - cms_data:/app/data
      - cms_uploads:/app/public/uploads
    expose:
      - "1337"

  web:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      cms:
        condition: service_healthy
    environment:
      NUXT_CONTENT_SOURCE: cms
      NUXT_STRAPI_URL: http://cms:1337
      NUXT_STRAPI_TOKEN: ${NUXT_STRAPI_TOKEN:-}
      NUXT_PUBLIC_SITE_URL: ${SITE_PUBLIC_URL:?Set SITE_PUBLIC_URL}
      NUXT_PUBLIC_STRAPI_MEDIA_URL: ${CMS_PUBLIC_URL}
    expose:
      - "3000"

volumes:
  cms_data:
  cms_uploads:
